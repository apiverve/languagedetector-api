name: apiverve_languagedetector
description: "Language Detector is a language detection API that identifies the language of any submitted text string. It returns the primary language, its ISO 639-1 code, and candidate matches ranked by confidence scores."
version: 1.2.5
homepage: https://apiverve.com/marketplace/languagedetector?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/languagedetector-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
